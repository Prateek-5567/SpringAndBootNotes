spring.application.name=Todo
#server.port=6969
# anything you want to configure about application you can do it here.

spring.mvc.view.prefix = /WEB-INF/jsp/
spring.mvc.view.suffix = .jsp
# /src/main/resources/META-INF/resources  => spring already knows yaha tak ka path
# spring.mvc.view mention kia h too itna path to Spring ko pata hi h 

#logging.level.org.springframework = info
#logging.level.org.Project.Todo = debug

# set default date fromat : yyyy-MM-dd ; (m:minutes ; M:month)
spring.mvc.format.date = yyyy-MM-dd

# below 2 lines are to enable and set url for h2-database (In memory db of SpringBoot)
