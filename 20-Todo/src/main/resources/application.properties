# below 2 command is to run data.sql by default and that too only after executing Todo.java class i.e only after creating the table. first one is for permission second is for timing.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

logging.level.org.springframework.jdbc.datasource.init=DEBUG

